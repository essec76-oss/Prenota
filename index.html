<script>
(function(){

  // -----------------------------
  // Config Supabase
  // -----------------------------
  const SUPABASE_URL = 'https://smwtbonxhvhrnyukrluw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_hEooIlJGPblzlaUbdO_ssA_wKEz6I-B';

  let supabase = null;
  let currentUser = null;

  function initSupabaseClient(accessToken){
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: {
        headers: {
          Authorization: `Bearer ${accessToken}`
        }
      }
    });
  }

  // -----------------------------
  // Login con whitelist (MODIFICATO)
  // -----------------------------
  async function loginWithCode(code){
    const errorEl = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    errorEl.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Accesso in corso…';

    try{
      // RIMOSSI apikey e Authorization - SOLO Content-Type
      const response = await fetch(
        SUPABASE_URL + '/functions/v1/login-whitelist',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({ code })
        }
      );

      const data = await response.json();

      if(!response.ok){
        throw new Error(data.error || 'Errore di accesso');
      }

      const { access_token, refresh_token, user } = data;

      localStorage.setItem('wl_access_token', access_token);
      localStorage.setItem('wl_refresh_token', refresh_token);
      localStorage.setItem('wl_user', JSON.stringify(user));

      currentUser = user;

      initSupabaseClient(access_token);

      closeLoginOverlay();
      updateUIForLoggedInUser();

    }catch(error){
      errorEl.textContent = error.message || 'Errore di accesso';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Accedi';
    }
  }

  function closeLoginOverlay(){
    document.getElementById('login-overlay').style.display = 'none';
  }

  function updateUIForLoggedInUser(){
    if(!currentUser){
      return;
    }

    const badge = document.getElementById('user-badge');
    badge.textContent =
      `${currentUser.display_name} (${currentUser.code})`;
  }

  document.getElementById('login-btn').addEventListener('click', () => {
    const code = document.getElementById('whitelist-code').value.trim();

    if(!code){
      document.getElementById('login-error').textContent =
        'Inserisci il codice della tessera.';
      return;
    }

    loginWithCode(code);
  });

  // Carica sessione esistente
  const savedToken = localStorage.getItem('wl_access_token');
  const savedUser = localStorage.getItem('wl_user');

  if(savedToken && savedUser){
    try{
      currentUser = JSON.parse(savedUser);
      initSupabaseClient(savedToken);
      closeLoginOverlay();
      updateUIForLoggedInUser();
    }catch(error){
      localStorage.removeItem('wl_access_token');
      localStorage.removeItem('wl_refresh_token');
      localStorage.removeItem('wl_user');
    }
  }

  // -----------------------------
  // Logica prenotazioni (invariata)
  // -----------------------------
  const FIELDS = {
    tennis: {
      key:'tennis',
      label:'Campo da tennis',
      color:'--tennis',
      colorSoft:'--tennis-soft',
      slotMinutes:60,
      start:8 * 60,
      end:22 * 60,
      minNames:2,
      maxNames:4
    },
    padel: {
      key:'padel',
      label:'Campo da padel',
      color:'--padel',
      colorSoft:'--padel-soft',
      slotMinutes:90,
      start:8 * 60,
      end:21 * 60 + 30,
      minNames:4,
      maxNames:4
    }
  };

  const DOW = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const MONTHS = [
    'Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'
  ];

  let currentField = 'tennis';
  let selectedDate = null;
  let bookingsCache = {};
  let renderRequestId = 0;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const maxDate = new Date(today);
  maxDate.setDate(maxDate.getDate() + 60);

  const baseMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxMonth = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
  let viewMonth = new Date(baseMonth);

  function pad(value){
    return String(value).padStart(2, '0');
  }

  function dateKey(date){
    return [
      date.getFullYear(),
      pad(date.getMonth() + 1),
      pad(date.getDate())
    ].join('-');
  }

  function minutesToTime(minutes){
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;
    return pad(hours) + ':' + pad(mins);
  }

  function setAccent(field){
    const fieldConfig = FIELDS[field];
    const rootStyle = getComputedStyle(document.documentElement);

    document.documentElement.style.setProperty(
      '--accent',
      rootStyle.getPropertyValue(fieldConfig.color)
    );

    document.documentElement.style.setProperty(
      '--accent-soft',
      rootStyle.getPropertyValue(fieldConfig.colorSoft)
    );
  }

  function renderFieldNote(){
    const note = document.getElementById('field-note');

    note.textContent = currentField === 'tennis'
      ? 'Slot da 1 ora. Servono almeno 2 nomi per prenotare, fino a 4 giocatori.'
      : 'Slot da 1 ora e mezza. Servono esattamente 4 nomi per prenotare.';
  }

  function renderDow(){
    document.getElementById('cal-dow').innerHTML =
      DOW.map(day => `<div class="cal-dow">${day}</div>`).join('');
  }

  function isSameMonth(firstDate, secondDate){
    return (
      firstDate.getFullYear() === secondDate.getFullYear() &&
      firstDate.getMonth() === secondDate.getMonth()
    );
  }

  function renderMonthNav(){
    document.getElementById('month-label').textContent =
      MONTHS[viewMonth.getMonth()] + ' ' + viewMonth.getFullYear();

    document.getElementById('prev-month').disabled =
      isSameMonth(viewMonth, baseMonth);

    document.getElementById('next-month').disabled =
      isSameMonth(viewMonth, maxMonth);
  }

  function renderCalendar(){
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    const year = viewMonth.getFullYear();
    const month = viewMonth.getMonth();

    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay() - 1;
    if(startOffset < 0) startOffset = 6;

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for(let i = 0; i < startOffset; i++){
      const cell = document.createElement('div');
      cell.className = 'cal-day empty';
      cell.setAttribute('aria-hidden', 'true');
      grid.appendChild(cell);
    }

    for(let day = 1; day <= daysInMonth; day++){
      const thisDate = new Date(year, month, day);
      const key = dateKey(thisDate);

      const isPast = thisDate < today;
      const isBeyondLimit = thisDate > maxDate;
      const isDisabled = isPast || isBeyondLimit;

      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className =
        'cal-day' +
        (isDisabled ? ' past' : '') +
        (key === selectedDate ? ' selected' : '');

      cell.textContent = day;
      cell.disabled = isDisabled;
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute(
        'aria-label',
        thisDate.toLocaleDateString('it-IT', {
          weekday:'long',
          day:'numeric',
          month:'long',
          year:'numeric'
        })
      );

      if(key === selectedDate){
        cell.setAttribute('aria-selected', 'true');
      }

      if(!isDisabled){
        cell.addEventListener('click', () => {
          selectedDate = key;
          bookingsCache = {};
          renderCalendar();
          renderSlots();
        });
      }

      grid.appendChild(cell);
    }

    renderMonthNav();
  }

  async function loadBookings(date){
    const cacheKey = currentField + '_' + date;

    if(Object.prototype.hasOwnProperty.call(bookingsCache, cacheKey)){
      return bookingsCache[cacheKey];
    }

    if(!supabase){
      throw new Error('Client Supabase non inizializzato');
    }

    const { data: rows, error } = await supabase
      .from('Tennis')
      .select('time,names,user_id')
      .eq('field', currentField)
      .eq('date', date)
      .is('cancelled_at', null);

    if(error){
      throw error;
    }

    const data = {};

    rows.forEach(row => {
      let names = [];

      if(Array.isArray(row.names)){
        names = row.names
          .map(name => String(name).trim())
          .filter(Boolean);
      }else if(typeof row.names === 'string'){
        names = row.names
          .split(',')
          .map(name => name.trim())
          .filter(Boolean);
      }

      data[row.time] = {
        names,
        user_id: row.user_id
      };
    });

    bookingsCache[cacheKey] = data;
    return data;
  }

  function buildSlots(field){
    const fieldConfig = FIELDS[field];
    const slots = [];

    for(
      let start = fieldConfig.start;
      start + fieldConfig.slotMinutes <= fieldConfig.end;
      start += fieldConfig.slotMinutes
    ){
      const end = start + fieldConfig.slotMinutes;

      slots.push({
        start,
        end,
        label: minutesToTime(start) + ' – ' + minutesToTime(end)
      });
    }

    return slots;
  }

  async function renderSlots(){
    const requestId = ++renderRequestId;
    const fieldAtRequest = currentField;
    const dateAtRequest = selectedDate;

    const section = document.getElementById('slots-section');
    const title = document.getElementById('slots-title');
    const list = document.getElementById('slot-list');

    if(!dateAtRequest){
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';

    const selected = new Date(dateAtRequest + 'T00:00:00');

    title.textContent = selected.toLocaleDateString('it-IT', {
      weekday:'long',
      day:'numeric',
      month:'long'
    });

    list.innerHTML =
      '<div class="empty-msg">Carico gli orari…</div>';

    try{
      const bookings = await loadBookings(dateAtRequest);

      if(
        requestId !== renderRequestId ||
        fieldAtRequest !== currentField ||
        dateAtRequest !== selectedDate
      ){
        return;
      }

      list.innerHTML = '';

      buildSlots(currentField).forEach(slot => {
        const timeId = minutesToTime(slot.start);
        const booking = bookings[timeId];

        const row = document.createElement('div');
        row.className = 'slot ' + (booking ? 'booked' : 'available');

        const left = document.createElement('div');

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = slot.label;

        const status = document.createElement('div');
        status.className = 'status';
        status.textContent = booking
          ? 'Prenotato da: ' + booking.names.join(', ')
          : 'Libero';

        left.appendChild(time);
        left.appendChild(status);
        row.appendChild(left);

        if(!booking){
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'book-btn';
          button.textContent = 'Prenota';
          button.setAttribute(
            'aria-label',
            'Prenota lo slot ' + slot.label
          );

          button.addEventListener('click', () => {
            openBookingModal(slot, timeId);
          });

          row.appendChild(button);
        }else{
          const cancelButton = document.createElement('button');
          cancelButton.type = 'button';
          cancelButton.className = 'cancel-btn';
          cancelButton.textContent = 'Cancella';

          const isOwner =
            currentUser &&
            booking.user_id === currentUser.auth_user_id;

          if(isOwner){
            cancelButton.addEventListener('click', () => {
              openCancellationModal(slot, timeId, booking);
            });
            row.appendChild(cancelButton);
          }
        }

        list.appendChild(row);
      });

    }catch(error){
      list.innerHTML =
        '<div class="empty-msg">' +
        'Errore nel caricamento degli orari. Riprova.' +
        '</div>';
    }
  }

  function openBookingModal(slot, timeId){
    const fieldConfig = FIELDS[currentField];
    const root = document.getElementById('modal-root');

    let fieldsHtml = '';

    for(let i = 0; i < fieldConfig.maxNames; i++){
      const required = i < fieldConfig.minNames;

      fieldsHtml += `
        <div class="name-field">
          <label for="name-${i}">
            Nome ${i + 1}
            ${required ? '(obbligatorio)' : '(facoltativo)'}
          </label>

          <input
            id="name-${i}"
            type="text"
            maxlength="60"
            autocomplete="off">
        </div>
      `;
    }

    const selected = new Date(selectedDate + 'T00:00:00');

    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title">

          <h2 id="modal-title">${fieldConfig.label}</h2>

          <div class="meta">
            ${selected.toLocaleDateString('it-IT', {
              weekday:'long',
              day:'numeric',
              month:'long',
              year:'numeric'
            })}
            · ${slot.label}
          </div>

          ${fieldsHtml}

          <div
            class="form-error"
            id="form-error"
            role="alert"
            aria-live="polite">
          </div>

          <div class="modal-actions">
            <button class="btn-cancel" id="btn-cancel" type="button">
              Annulla
            </button>

            <button class="btn-confirm" id="btn-confirm" type="button">
              Conferma
            </button>
          </div>
        </div>
      </div>
    `;

    const firstInput = document.getElementById('name-0');
    if(firstInput){
      firstInput.focus();
    }

    document.getElementById('btn-cancel').addEventListener('click', closeModal);

    document.getElementById('overlay').addEventListener('click', event => {
      if(event.target.id === 'overlay'){
        closeModal();
      }
    });

    document.getElementById('btn-confirm').addEventListener('click', () => {
      confirmBooking(timeId, slot);
    });
  }

  function handleModalEscape(event){
    if(event.key === 'Escape'){
      closeModal();
    }
  }

  function closeModal(){
    document.getElementById('modal-root').innerHTML = '';
    document.removeEventListener('keydown', handleModalEscape);
  }

  function readNames(nameCount){
    const names = [];

    for(let i = 0; i < nameCount; i++){
      const input = document.getElementById('name-' + i);
      if(!input) continue;

      const value = input.value.trim();
      if(value) names.push(value);
    }

    return names;
  }

  function validateNames(names){
    const fieldConfig = FIELDS[currentField];

    if(currentField === 'padel'){
      return names.length === fieldConfig.maxNames;
    }

    return (
      names.length >= fieldConfig.minNames &&
      names.length <= fieldConfig.maxNames
    );
  }

  async function confirmBooking(timeId, slot){
    const names = readNames(FIELDS[currentField].maxNames);
    const errorEl = document.getElementById('form-error');
    const confirmBtn = document.getElementById('btn-confirm');

    if(!validateNames(names)){
      errorEl.textContent = currentField === 'padel'
        ? 'Servono esattamente 4 nomi per prenotare il padel.'
        : 'Servono da 2 a 4 nomi per prenotare il tennis.';
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Salvo…';
    errorEl.textContent = '';

    const fieldAtBooking = currentField;
    const dateAtBooking = selectedDate;

    try{
      if(!supabase){
        throw new Error('Client Supabase non inizializzato');
      }

      const bookings = await loadBookings(dateAtBooking);

      if(bookings[timeId]){
        throw new Error('Questo slot è stato prenotato da qualcun altro.');
      }

      const { data, error } = await supabase
        .from('Tennis')
        .insert({
          field: fieldAtBooking,
          date: dateAtBooking,
          time: timeId,
          names: names.join(', '),
          user_id: currentUser.auth_user_id
        })
        .select()
        .single();

      if(error){
        if(error.code === '23505'){
          throw new Error('Questo slot è stato prenotato da qualcun altro.');
        }
        throw new Error(error.message || 'Salvataggio non riuscito.');
      }

      closeModal();

      delete bookingsCache[fieldAtBooking + '_' + dateAtBooking];

      showToast('Prenotazione confermata per le ' + timeId);
      renderSlots();

    }catch(error){
      errorEl.textContent =
        'Errore: ' +
        (error && error.message ? error.message : 'salvataggio non riuscito');

      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Conferma';
    }
  }

  function openCancellationModal(slot, timeId, booking){
    const root = document.getElementById('modal-root');

    root.innerHTML = `
      <div class="overlay" id="cancel-overlay">
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cancel-title">

          <h2 id="cancel-title">Cancella prenotazione</h2>

          <div class="meta">
            ${slot.label}
          </div>

          <p style="margin:0 0 18px;font-size:14px;color:var(--ink-soft);">
            Sei sicuro di voler cancellare questa prenotazione?
          </p>

          <div class="modal-actions">
            <button class="btn-cancel" id="cancel-close" type="button">
              Annulla
            </button>

            <button class="btn-confirm" id="cancel-confirm" type="button">
              Cancella
            </button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('cancel-close').addEventListener('click', closeModal);

    document.getElementById('cancel-overlay').addEventListener('click', event => {
      if(event.target.id === 'cancel-overlay'){
        closeModal();
      }
    });

    document.getElementById('cancel-confirm').addEventListener('click', () => {
      confirmCancellation(timeId, booking);
    });
  }

  async function confirmCancellation(timeId, booking){
    const button = document.getElementById('cancel-confirm');

    button.disabled = true;
    button.textContent = 'Cancello…';

    try{
      if(!supabase){
        throw new Error('Client Supabase non inizializzato');
      }

      const { error } = await supabase
        .from('Tennis')
        .delete()
        .eq('id', booking.id)
        .eq('user_id', currentUser.auth_user_id);

      if(error){
        throw new Error(error.message || 'Cancellazione non riuscita.');
      }

      closeModal();

      delete bookingsCache[currentField + '_' + selectedDate];

      showToast('Prenotazione cancellata.');
      renderSlots();

    }catch(error){
      showToast(error.message || 'Cancellazione non riuscita.');
      button.disabled = false;
      button.textContent = 'Cancella';
    }
  }

  function showToast(message){
    const root = document.getElementById('toast-root');

    root.innerHTML =
      `<div class="toast" role="status">${message}</div>`;

    setTimeout(() => {
      root.innerHTML = '';
    }, 3000);
  }

  function switchField(field){
    currentField = field;
    bookingsCache = {};

    document.getElementById('tab-tennis').classList.toggle('active', field === 'tennis');
    document.getElementById('tab-padel').classList.toggle('active', field === 'padel');

    document.getElementById('tab-tennis').setAttribute('aria-selected', field === 'tennis' ? 'true' : 'false');
    document.getElementById('tab-padel').setAttribute('aria-selected', field === 'padel' ? 'true' : 'false');

    setAccent(field);
    renderFieldNote();
    renderSlots();
  }

  document.getElementById('tab-tennis').addEventListener('click', () => switchField('tennis'));
  document.getElementById('tab-padel').addEventListener('click', () => switchField('padel'));

  document.getElementById('prev-month').addEventListener('click', () => {
    if(isSameMonth(viewMonth, baseMonth)) return;
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
    renderCalendar();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    if(isSameMonth(viewMonth, maxMonth)) return;
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    renderCalendar();
  });

  setAccent('tennis');
  renderFieldNote();
  renderDow();
  renderCalendar();

})();
  });
</script>
