<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenota il campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBF8;
    --surface:#FFFFFF;
    --ink:#1B241F;
    --ink-soft:#5B655F;
    --line:#E2E0D6;
    --tennis:#B84B1E;
    --tennis-soft:#F4DFD2;
    --padel:#2B6E5A;
    --padel-soft:#D9E9E1;
    --booked:#EFEDE6;
    --accent: var(--tennis);
    --accent-soft: var(--tennis-soft);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.15;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:15px;margin:0 0 22px;}
  .tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:12px 8px;font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink-soft);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .field-note{font-size:14px;color:var(--ink-soft);background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:20px;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .month-nav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink);}
  .month-nav button:disabled{opacity:.3;cursor:default;}
  .month-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .month-label{font-family:'Fraunces',serif;font-weight:600;font-size:19px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--ink-soft);padding-bottom:4px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:15px;cursor:pointer;color:var(--ink);}
  .cal-day.empty{border:none;background:none;cursor:default;}
  .cal-day.past{color:#C7C4B8;background:var(--bg);border-color:var(--line);cursor:not-allowed;}
  .cal-day.selected{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .cal-day:not(.empty):not(.past):not(.selected):hover{border-color:var(--accent);}
  .cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .slots-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:26px 0 12px;}
  .slot-list{display:flex;flex-direction:column;gap:8px;}
  .slot{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;}
  .slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .slot .time{font-weight:600;}
  .slot .status{font-size:13px;color:var(--ink-soft);}
  .slot.booked{background:var(--booked);cursor:default;}
  .slot.booked .status{color:var(--ink-soft);}
  .slot.available:hover{border-color:var(--accent);}
  .slot .book-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;}
  .slot .book-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .slot .cancel-btn{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);}
  .empty-msg{color:var(--ink-soft);font-size:14px;padding:16px 0;}
  .overlay{position:fixed;inset:0;background:rgba(27,36,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;}
  @media (min-width:520px){.overlay{align-items:center;}}
  .modal{background:var(--surface);border-radius:14px 14px 0 0;padding:22px 20px 26px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  @media (min-width:520px){.modal{border-radius:14px;}}
  .modal h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;}
  .modal .meta{color:var(--ink-soft);font-size:14px;margin-bottom:18px;}
  .name-field{margin-bottom:12px;}
  .name-field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  .name-field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;}
  .name-field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions button{flex:1;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--line);}
  .btn-cancel{background:var(--surface);color:var(--ink);}
  .btn-confirm{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-confirm:disabled{opacity:.4;cursor:not-allowed;}
  .form-error{color:var(--tennis);font-size:13px;margin-top:8px;min-height:16px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;z-index:20;}
  @media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out;}}
  @keyframes up{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prenota il campo</h1>
  <p class="sub">Scegli tennis o padel, poi il giorno e l'orario. Bastano i nomi di chi gioca.</p>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-tennis" role="tab" aria-selected="true">Tennis</button>
    <button class="tab" id="tab-padel" role="tab" aria-selected="false">Padel</button>
  </div>
  <div class="field-note" id="field-note"></div>
  <div class="month-nav">
    <button id="prev-month" aria-label="Mese precedente">‹</button>
    <div class="month-label" id="month-label"></div>
    <button id="next-month" aria-label="Mese successivo">›</button>
  </div>
  <div class="cal-grid" id="cal-dow"></div>
  <div class="cal-grid" id="cal-grid"></div>
  <div id="slots-section" style="display:none;">
    <div class="slots-title" id="slots-title"></div>
    <div class="slot-list" id="slot-list"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
(function(){
  const FIELDS = {
    tennis: { key:'tennis', label:'Campo da tennis', color:'--tennis', colorSoft:'--tennis-soft',
      slotMinutes:60, start:8, end:22, minNames:2, maxNames:4 },
    padel: { key:'padel', label:'Campo da padel', color:'--padel', colorSoft:'--padel-soft',
      slotMinutes:90, start:8, end:21.5, minNames:4, maxNames:4 }
  };
  const DOW = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  let currentField = 'tennis';
  const today = new Date(); today.setHours(0,0,0,0);
  const baseMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxMonth = new Date(today.getFullYear(), today.getMonth()+1, 1);
  let viewMonth = new Date(baseMonth);
  let selectedDate = null;
  let bookingsCache = {};
  function pad(n){return n.toString().padStart(2,'0');}
  function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function fmtTime(h){const hh=Math.floor(h), mm=Math.round((h-hh)*60); return pad(hh)+':'+pad(mm);}
  function setAccent(field){
    const f = FIELDS[field];
    document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue(f.color));
    document.documentElement.style.setProperty('--accent-soft', getComputedStyle(document.documentElement).getPropertyValue(f.colorSoft));
  }
  function renderFieldNote(){
    const note = currentField === 'tennis'
      ? 'Slot da 1 ora. Servono almeno 2 nomi per prenotare (fino a 4 facoltativi).'
      : 'Slot da 1 ora e mezza. Servono esattamente 4 nomi per prenotare.';
    document.getElementById('field-note').textContent = note;
  }
  function renderDow(){
    document.getElementById('cal-dow').innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  }
  function renderMonthNav(){
    document.getElementById('month-label').textContent = MONTHS[viewMonth.getMonth()] + ' ' + viewMonth.getFullYear();
    document.getElementById('prev-month').disabled = (viewMonth.getFullYear()===baseMonth.getFullYear() && viewMonth.getMonth()===baseMonth.getMonth());
    document.getElementById('next-month').disabled = (viewMonth.getFullYear()===maxMonth.getFullYear() && viewMonth.getMonth()===maxMonth.getMonth());
  }
  function renderCalendar(){
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay() - 1; if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for(let i=0;i<startOffset;i++){
      const cell = document.createElement('div');
      cell.className = 'cal-day empty';
      grid.appendChild(cell);
    }
    for(let d=1; d<=daysInMonth; d++){
      const thisDate = new Date(year, month, d);
      const key = dateKey(thisDate);
      const isPast = thisDate < today;
      const cell = document.createElement('button');
      cell.className = 'cal-day' + (isPast?' past':'') + (key===selectedDate?' selected':'');
      cell.textContent = d;
      cell.disabled = isPast;
      if(!isPast){
        cell.addEventListener('click', ()=>{ selectedDate = key; renderCalendar(); renderSlots(); });
      }
      grid.appendChild(cell);
    }
    renderMonthNav();
  }
  const SUPABASE_URL = 'https://smwtbonxhvhrnyukrluw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_hEooIlJGPblzlaUbdO_ssA_wKEz6I-B';
  const SUPABASE_TABLE = 'Tennis';
  async function loadBookings(key){
    try{
      const url = SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE
        + '?select=id,time,names&field=eq.' + encodeURIComponent(currentField)
        + '&date=eq.' + encodeURIComponent(key);
      const res = await fetch(url, {
        headers: { apikey: SUPABASE_KEY }
      });
      if(!res.ok) throw new Error('fetch failed');
      const rows = await res.json();
      const data = {};
      rows.forEach(r=>{
        data[r.time] = { id: r.id, names: (r.names||'').split(',').map(s=>s.trim()).filter(Boolean) };
      });
      bookingsCache[key] = data;
      return data;
    }catch(e){
      bookingsCache[key] = {};
      return {};
    }
  }
  function buildSlots(field){
    const f = FIELDS[field];
    const slots = [];
    const stepHours = f.slotMinutes/60;
    for(let h=f.start; h+stepHours<=f.end+0.001; h+=stepHours){
      slots.push({ start: h, end: h+stepHours, label: fmtTime(h)+' – '+fmtTime(h+stepHours) });
    }
    return slots;
  }
  async function renderSlots(){
    const section = document.getElementById('slots-section');
    const title = document.getElementById('slots-title');
    const list = document.getElementById('slot-list');
    if(!selectedDate){ section.style.display='none'; return; }
    section.style.display = 'block';
    const d = new Date(selectedDate+'T00:00:00');
    title.textContent = d.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
    list.innerHTML = '<div class="empty-msg">Carico gli orari…</div>';
    const bookings = await loadBookings(selectedDate);
    const slots = buildSlots(currentField);
    list.innerHTML = '';
    slots.forEach(s=>{
      const timeId = fmtTime(s.start);
      const booking = bookings[timeId];
      const row = document.createElement('div');
      row.className = 'slot ' + (booking ? 'booked' : 'available');
      const left = document.createElement('div');
      left.innerHTML = `<div class="time">${s.label}</div><div class="status">${booking ? 'Prenotato da: '+booking.names.join(', ') : 'Libero'}</div>`;
      row.appendChild(left);
      if(!booking){
        const btn = document.createElement('button');
        btn.className = 'book-btn';
        btn.textContent = 'Prenota';
        btn.addEventListener('click', ()=> openBookingModal(s, timeId));
        row.appendChild(btn);
      }else{
        const btn = document.createElement('button');
        btn.className = 'book-btn cancel-btn';
        btn.textContent = 'Cancella';
        btn.addEventListener('click', ()=> openCancelModal(s, timeId, booking));
        row.appendChild(btn);
      }
      list.appendChild(row);
    });
  }
  function openBookingModal(slot, timeId){
    const f = FIELDS[currentField];
    const root = document.getElementById('modal-root');
    const nameCount = 4;
    const requiredCount = f.minNames;
    let fieldsHtml = '';
    for(let i=0;i<nameCount;i++){
      const isRequired = i < requiredCount;
      fieldsHtml += `<div class="name-field">
        <label for="name-${i}">Nome ${i+1}${isRequired?' (obbligatorio)':' (facoltativo)'}</label>
        <input id="name-${i}" type="text" autocomplete="off" />
      </div>`;
    }
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <h2 id="modal-title">${f.label}</h2>
          <div class="meta">${new Date(selectedDate+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long'})} · ${slot.label}</div>
          ${fieldsHtml}
          <div class="form-error" id="form-error"></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="btn-cancel">Annulla</button>
            <button class="btn-confirm" id="btn-confirm">Conferma</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
    document.getElementById('btn-confirm').addEventListener('click', ()=> confirmBooking(timeId, requiredCount, nameCount));
  }
  function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
  function openCancelModal(slot, timeId, booking){
    const f = FIELDS[currentField];
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancel-title">
          <h2 id="cancel-title">Cancella prenotazione</h2>
          <div class="meta">${new Date(selectedDate+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long'})} · ${slot.label} · ${f.label}</div>
          <div class="name-field">
            <label for="cancel-name">Scrivi uno dei nomi della prenotazione per confermare (${booking.names.join(', ')})</label>
            <input id="cancel-name" type="text" autocomplete="off" />
          </div>
          <div class="form-error" id="form-error"></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="btn-cancel">Indietro</button>
            <button class="btn-confirm" id="btn-confirm">Cancella prenotazione</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
    document.getElementById('btn-confirm').addEventListener('click', ()=> doCancelBooking(timeId, booking));
  }
  async function doCancelBooking(timeId, booking){
    const errorEl = document.getElementById('form-error');
    const typed = document.getElementById('cancel-name').value.trim().toLowerCase();
    const match = booking.names.some(n => n.toLowerCase() === typed);
    if(!typed || !match){
      errorEl.textContent = 'Il nome inserito non corrisponde a nessuno dei nomi della prenotazione.';
      return;
    }
    const confirmBtn = document.getElementById('btn-confirm');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Cancello…';
    try{
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE + '?id=eq.' + encodeURIComponent(booking.id), {
        method: 'DELETE',
        headers: { apikey: SUPABASE_KEY }
      });
      if(!res.ok) throw new Error('delete failed');
      closeModal();
      showToast('Prenotazione cancellata');
      renderSlots();
    }catch(e){
      errorEl.textContent = 'Errore nella cancellazione. Riprova.';
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Cancella prenotazione';
    }
  }
  async function confirmBooking(timeId, requiredCount, nameCount){
    const names = [];
    for(let i=0;i<nameCount;i++){
      const val = document.getElementById('name-'+i).value.trim();
      if(val) names.push(val);
    }
    const errorEl = document.getElementById('form-error');
    if(names.length < requiredCount){
      errorEl.textContent = currentField==='padel'
        ? 'Servono esattamente 4 nomi per prenotare il padel.'
        : `Servono almeno ${requiredCount} nomi per prenotare il tennis.`;
      return;
    }
    const confirmBtn = document.getElementById('btn-confirm');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Salvo…';
    try{
      const bookings = await loadBookings(selectedDate);
      if(bookings[timeId]){
        errorEl.textContent = 'Questo slot è appena stato prenotato da qualcun altro.';
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Conferma';
        return;
      }
      const insertRes = await fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({ field: currentField, date: selectedDate, time: timeId, names: names.join(', ') })
      });
      if(!insertRes.ok){
        let detail = '';
        try{ const errBody = await insertRes.json(); detail = errBody.message || errBody.hint || JSON.stringify(errBody); }catch(_){ detail = insertRes.status + ' ' + insertRes.statusText; }
        throw new Error(detail);
      }
      closeModal();
      showToast('Prenotazione confermata per le ' + timeId);
      renderSlots();
    }catch(e){
      errorEl.textContent = 'Errore: ' + (e && e.message ? e.message : 'salvataggio non riuscito');
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Conferma';
    }
  }
  function showToast(msg){
    const root = document.getElementById('toast-root');
    root.innerHTML = `<div class="toast">${msg}</div>`;
    setTimeout(()=>{ root.innerHTML=''; }, 2600);
  }
  function switchField(field){
    currentField = field;
    document.getElementById('tab-tennis').classList.toggle('active', field==='tennis');
    document.getElementById('tab-padel').classList.toggle('active', field==='padel');
    document.getElementById('tab-tennis').setAttribute('aria-selected', field==='tennis');
    document.getElementById('tab-padel').setAttribute('aria-selected', field==='padel');
    setAccent(field);
    renderFieldNote();
    bookingsCache = {};
    renderSlots();
  }
  document.getElementById('tab-tennis').addEventListener('click', ()=>switchField('tennis'));
  document.getElementById('tab-padel').addEventListener('click', ()=>switchField('padel'));
  document.getElementById('prev-month').addEventListener('click', ()=>{
    if(viewMonth.getFullYear()===baseMonth.getFullYear() && viewMonth.getMonth()===baseMonth.getMonth()) return;
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1);
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', ()=>{
    if(viewMonth.getFullYear()===maxMonth.getFullYear() && viewMonth.getMonth()===maxMonth.getMonth()) return;
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1);
    renderCalendar();
  });
  setAccent('tennis');
  renderFieldNote();
  renderDow();
  renderCalendar();
})();
</script>
</body>
</html>
