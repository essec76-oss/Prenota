<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenota il campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#FBFBF8;--surface:#FFFFFF;--ink:#1B241F;--ink-soft:#5B655F;--line:#E2E0D6;--tennis:#B84B1E;--tennis-soft:#F4DFD2;--padel:#2B6E5A;--padel-soft:#D9E9E1;--booked:#EFEDE6;--accent:var(--tennis);--accent-soft:var(--tennis-soft);}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 4px;} .sub{color:var(--ink-soft);font-size:15px;margin:0 0 22px;}
  .tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:12px 8px;font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink-soft);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .field-note{font-size:14px;color:var(--ink-soft);background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:20px;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .month-nav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink);}
  .month-label{font-family:'Fraunces',serif;font-weight:600;font-size:19px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--ink-soft);padding-bottom:4px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:15px;cursor:pointer;color:var(--ink);}
  .cal-day.empty{border:none;background:none;cursor:default;} .cal-day.past{color:#C7C4B8;background:var(--bg);border-color:var(--line);cursor:not-allowed;}
  .cal-day.selected{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .slots-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:26px 0 12px;}
  .slot-list{display:flex;flex-direction:column;gap:8px;}
  .slot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:15px;}
  .slot.booked{background:var(--booked);} .slot .time{font-weight:600;} .slot .status{font-size:13px;color:var(--ink-soft);}
  .slot .book-btn{flex-shrink:0;border:none;border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;}
  .empty-msg{color:var(--ink-soft);font-size:14px;padding:16px 0;}
  .overlay{position:fixed;inset:0;background:rgba(27,36,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;}
  @media (min-width:520px){.overlay{align-items:center;}}
  .modal{background:var(--surface);border-radius:14px 14px 0 0;padding:22px 20px 26px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  @media (min-width:520px){.modal{border-radius:14px;}}
  .modal h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;} .modal .meta{color:var(--ink-soft);font-size:14px;margin-bottom:18px;}
  .name-field{margin-bottom:12px;} .name-field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  .name-field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;} .modal-actions button{flex:1;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--line);}
  .btn-cancel{background:var(--surface);color:var(--ink);} .btn-confirm{background:var(--accent);color:#fff;border-color:var(--accent)!important;}
  .form-error{color:var(--tennis);font-size:13px;margin-top:8px;min-height:16px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Prenota il campo</h1>
  <p class="sub">Scegli tennis o padel, poi il giorno e l'orario.</p>

  <div class="tabs" role="tablist" aria-label="Tipo di campo">
    <button class="tab active" id="tab-tennis" role="tab" aria-selected="true">Tennis</button>
    <button class="tab" id="tab-padel" role="tab" aria-selected="false">Padel</button>
  </div>

  <div class="field-note" id="field-note" aria-live="polite"></div>
  <div class="month-nav">
    <button id="prev-month" aria-label="Mese precedente">‹</button>
    <div class="month-label" id="month-label"></div>
    <button id="next-month" aria-label="Mese successivo">›</button>
  </div>
  <div class="cal-grid" id="cal-dow"></div>
  <div class="cal-grid" id="cal-grid" role="grid" aria-label="Calendario"></div>

  <div id="booking-panel" role="tabpanel">
    <div id="slots-section" style="display:none;">
      <div class="slots-title" id="slots-title"></div>
      <div class="slot-list" id="slot-list"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function(){
  // Configurazione Supabase
  const SUPABASE_URL = 'https://smwtbonxhvhrnyukrluw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtd3Rib254aHZocm55dWtybHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTk2NzgsImV4cCI6MjEwMzk5NTY3OH0.EO9H2rfctDfnLp_zbDqV0bPDW_HasvJgB0YSW8tSyoY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const FIELDS = {
    tennis: { key:'tennis', label:'Campo da tennis', slotMinutes:60, start:8*60, end:22*60, minNames:2, maxNames:4 },
    padel: { key:'padel', label:'Campo da padel', slotMinutes:90, start:8*60, end:21*60+30, minNames:4, maxNames:4 }
  };

  const DOW = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  let currentField = 'tennis';
  let selectedDate = null;
  let viewMonth = new Date();
  viewMonth.setDate(1);
  const today = new Date(); today.setHours(0,0,0,0);
  const maxDate = new Date(today); maxDate.setDate(maxDate.getDate()+60);
  const baseMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxMonth = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);

  function pad(v){ return String(v).padStart(2,'0'); }
  function dateKey(d){ return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join('-'); }
  function minutesToTime(m){ return pad(Math.floor(m/60)) + ':' + pad(m%60); }

  function switchField(field){
    currentField = field;
    document.getElementById('tab-tennis').classList.toggle('active', field === 'tennis');
    document.getElementById('tab-padel').classList.toggle('active', field === 'padel');
    renderFieldNote();
  }

  function renderFieldNote(){
    document.getElementById('field-note').textContent = currentField === 'tennis' ? 'Slot da 1 ora. Servono 2 nomi minimo.' : 'Slot da 1 ora e mezza. Servono 4 nomi esatti.';
  }

  function renderMonthNav(){
    document.getElementById('month-label').textContent = MONTHS[viewMonth.getMonth()] + ' ' + viewMonth.getFullYear();
    document.getElementById('prev-month').disabled = viewMonth <= baseMonth;
    document.getElementById('next-month').disabled = viewMonth >= maxMonth;
  }

  function renderCalendar(){
    const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
    const startOffset = (new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1).getDay() + 6) % 7;
    const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0).getDate();

    for(let i=0; i<startOffset; i++){ const c = document.createElement('div'); c.className = 'cal-day empty'; grid.appendChild(c); }
    for(let day=1; day<=daysInMonth; day++){
      const thisDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
      const isPast = thisDate < today || thisDate > maxDate;
      const cell = document.createElement('button'); cell.type='button';
      cell.className = 'cal-day' + (isPast ? ' past' : '') + (dateKey(thisDate) === selectedDate ? ' selected' : '');
      cell.textContent = day; cell.disabled = isPast;
      if(!isPast){ cell.addEventListener('click', () => { selectedDate = dateKey(thisDate); renderCalendar(); renderSlots(); }); }
      grid.appendChild(cell);
    }
    renderMonthNav();
  }

  async function renderSlots(){
    const section = document.getElementById('slots-section');
    const title = document.getElementById('slots-title');
    const list = document.getElementById('slot-list');
    if(!selectedDate){ section.style.display='none'; return; }

    section.style.display = 'block';
    title.textContent = new Date(selectedDate+'T00:00:00').toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
    list.innerHTML = '<div class="empty-msg">Carico gli orari…</div>';

    try{
      const { data: rows, error } = await supabase.from('Tennis').select('time,names').eq('field', currentField).eq('date', selectedDate);
      if(error) throw error;

      const bookings = {};
      rows.forEach(row => { bookings[row.time] = row.names; });
      list.innerHTML = '';

      for(let start = FIELDS[currentField].start; start + FIELDS[currentField].slotMinutes <= FIELDS[currentField].end; start += FIELDS[currentField].slotMinutes){
        const timeId = minutesToTime(start);
        const row = document.createElement('div'); row.className = 'slot ' + (bookings[timeId] ? 'booked' : 'available');
        const left = document.createElement('div');
        const time = document.createElement('div'); time.className='time'; time.textContent = timeId + ' – ' + minutesToTime(start + FIELDS[currentField].slotMinutes);
        const status = document.createElement('div'); status.className='status'; status.textContent = bookings[timeId] ? 'Prenotato' : 'Libero';
        left.appendChild(time); left.appendChild(status); row.appendChild(left);

        if(!bookings[timeId]){
          const btn = document.createElement('button'); btn.type='button'; btn.className='book-btn'; btn.textContent='Prenota';
          btn.addEventListener('click', () => openBookingModal(timeId));
          row.appendChild(btn);
        }
        list.appendChild(row);
      }
    }catch(e){ list.innerHTML = '<div class="empty-msg">Errore nel caricamento.</div>'; }
  }

  function openBookingModal(timeId){
    const fc = FIELDS[currentField];
    const root = document.getElementById('modal-root');
    let fields = '';
    for(let i=0; i<fc.maxNames; i++){
      const req = i < fc.minNames;
      fields += `<div class="name-field"><label for="name-${i}">Nome ${i+1} ${req ? '(obbligatorio)' : '(facoltativo)'}</label><input id="name-${i}" type="text" maxlength="60"></div>`;
    }
    root.innerHTML = `
      <div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">
      <h2>${fc.label}</h2><div class="meta">${new Date(selectedDate+'T00:00:00').toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'})} · ${timeId}</div>
      ${fields}<div class="form-error" id="form-error" role="alert"></div>
      <div class="modal-actions"><button class="btn-cancel" id="btn-cancel" type="button">Annulla</button><button class="btn-confirm" id="btn-confirm" type="button">Conferma</button></div>
      </div></div>`;
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-confirm').addEventListener('click', () => confirmBooking(timeId));
  }

  function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

  function readNames(){
    const names = [];
    for(let i=0; i<FIELDS[currentField].maxNames; i++){
      const val = document.getElementById('name-'+i).value.trim(); if(val) names.push(val);
    }
    return names;
  }

  async function confirmBooking(timeId){
    const names = readNames(); const errorEl = document.getElementById('form-error'); const btn = document.getElementById('btn-confirm');
    if(currentField === 'padel' && names.length !== 4){ errorEl.textContent = 'Servono esattamente 4 nomi.'; return; }
    if(currentField === 'tennis' && (names.length < 2 || names.length > 4)){ errorEl.textContent = 'Servono da 2 a 4 nomi.'; return; }
    btn.disabled = true; btn.textContent = 'Salvo…';
    try{
      const { error } = await supabase.from('Tennis').insert({ field: currentField, date: selectedDate, time: timeId, names: names.join(', ') });
      if(error) throw error;
      closeModal(); renderSlots(); showToast('Prenotazione confermata per le ' + timeId);
    }catch(err){ errorEl.textContent = err.message || 'Errore'; btn.disabled = false; btn.textContent = 'Conferma'; }
  }

  function showToast(msg){
    const root = document.getElementById('toast-root'); root.innerHTML = `<div class="toast">${msg}</div>`;
    setTimeout(() => { root.innerHTML=''; }, 3000);
  }

  document.getElementById('tab-tennis').addEventListener('click', () => switchField('tennis'));
  document.getElementById('tab-padel').addEventListener('click', () => switchField('padel'));
  document.getElementById('prev-month').addEventListener('click', () => { if(viewMonth > baseMonth){ viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1); renderCalendar(); } });
  document.getElementById('next-month').addEventListener('click', () => { if(viewMonth < maxMonth){ viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1); renderCalendar(); } });

  renderFieldNote(); renderDow(); renderCalendar();
  function renderDow(){ document.getElementById('cal-dow').innerHTML = DOW.map(d => `<div class="cal-dow">${d}</div>`).join(''); }
})();
</script>
</body>
</html>
